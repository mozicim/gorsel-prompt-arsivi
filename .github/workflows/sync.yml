name: Görsel Prompt Arşivi - Otomatik Senkronizasyon

on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Yeni repoları keşfet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/discover.sh
          ./scripts/discover.sh

      - name: Kaynakları senkronize et
        run: |
          chmod +x scripts/sync.sh
          ./scripts/sync.sh

      - name: Değişiklikleri commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repos/ scripts/sources.txt
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "Otomatik keşif + senkronizasyon: $(date -u +%Y-%m-%d)"
            git push
          fi
